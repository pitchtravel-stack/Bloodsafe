<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BloodSafe ร้องกวาง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════ tokens ═══════════ */
:root{
  --ground:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F9FC;
  --line:#D9E1EC; --line-soft:#E8EEF5;
  --ink:#0F1B2A; --ink-2:#3C4E63; --muted:#6B7C93;
  --accent:#1A5AA0; --accent-ink:#12457C; --accent-soft:#E4EEF9;
  --ok:#0F7355; --ok-soft:#DFF1EA;
  --warn:#A66300; --warn-soft:#FBEEDA;
  --crit:#B32D22; --crit-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(15,27,42,.06), 0 8px 24px -12px rgba(15,27,42,.18);
  --shadow-lg:0 2px 4px rgba(15,27,42,.06), 0 24px 48px -20px rgba(15,27,42,.30);
  --r:10px; --tap:46px;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B121B; --surface:#141D28; --surface-2:#1A2531;
    --line:#293646; --line-soft:#1F2B38;
    --ink:#E7EEF6; --ink-2:#B4C4D6; --muted:#8298B0;
    --accent:#63A4E8; --accent-ink:#8FC0F2; --accent-soft:#152A42;
    --ok:#4FCFA4; --ok-soft:#0E2F26; --warn:#E5A23F; --warn-soft:#33240D;
    --crit:#F1796A; --crit-soft:#381814;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 24px 48px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B121B; --surface:#141D28; --surface-2:#1A2531;
  --line:#293646; --line-soft:#1F2B38;
  --ink:#E7EEF6; --ink-2:#B4C4D6; --muted:#8298B0;
  --accent:#63A4E8; --accent-ink:#8FC0F2; --accent-soft:#152A42;
  --ok:#4FCFA4; --ok-soft:#0E2F26; --warn:#E5A23F; --warn-soft:#33240D;
  --crit:#F1796A; --crit-soft:#381814;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 24px 48px -20px rgba(0,0,0,.7);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
.spacer{flex:1}

/* show/hide by width */
.wide-only{display:none}
@media(min-width:900px){ .wide-only{display:revert} .narrow-only{display:none!important} }

/* ═══════════ demo ribbon ═══════════ */
.demo-bar{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);
  font-size:12px;padding:6px 14px;text-align:center;line-height:1.4}
.demo-bar b{font-weight:600}
.verbar{background:var(--crit);color:#fff;font-size:12.5px;padding:8px 14px;line-height:1.45;
  display:flex;gap:8px;align-items:flex-start}
.verbar svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.verbar b{font-weight:700}

/* ═══════════ login ═══════════ */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:18px;
  background:radial-gradient(1100px 520px at 80% -10%, var(--accent-soft), transparent 60%), var(--ground)}
.login-card{width:100%;max-width:940px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:860px){.login-card{grid-template-columns:1fr;max-width:520px}}
.login-side{padding:30px 26px;background:var(--surface-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:20px}
@media(max-width:860px){.login-side{border-right:none;border-bottom:1px solid var(--line);padding:22px 20px;gap:14px}
  .login-side .flowchain{display:none}}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:21px;height:21px}
.brand-name{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted)}
.login-side h1{font-family:var(--display);font-size:24px;line-height:1.28;margin:0;font-weight:600;text-wrap:balance}
.login-side p{margin:0;color:var(--ink-2);font-size:14px}
.flowchain{display:flex;flex-direction:column;margin:0;padding:0}
.flowchain li{list-style:none;display:grid;grid-template-columns:26px 1fr;gap:12px;padding:9px 0;position:relative}
.flowchain li:not(:last-child)::before{content:"";position:absolute;left:12.5px;top:31px;bottom:-9px;width:1px;background:var(--line)}
.flowchain .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent)}
.flowchain .t{font-size:13.5px;color:var(--ink-2);padding-top:2px}
.flowchain .t b{color:var(--ink);font-weight:600;display:block;font-size:14px}
.login-main{padding:30px 26px calc(30px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.login-main h2{font-family:var(--display);font-size:19px;margin:0;font-weight:600}

/* ═══════════ form controls ═══════════ */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;width:100%;min-height:var(--tap);font-size:16px;
  transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none}
.field textarea{min-height:76px;line-height:1.5}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:36px}
@media(min-width:900px){.field input,.field select,.field textarea{font-size:14.5px;min-height:40px;padding:8px 11px}
  .field select{padding-right:32px}}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:12px;color:var(--muted)}
.field .hint-note{color:var(--accent);font-weight:600}
/* ─── การแก้ไขย้อนหลังโดยผู้ดูแลระบบ ─── */
.sect-admin{border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.sect-admin>.sect-h{margin-top:0}
.reasonbox{border:1px solid var(--accent);border-radius:12px;padding:13px;background:var(--accent-soft)}
.reasonbox label{font-weight:600}
.logitem{border-bottom:1px solid var(--line-soft);padding:11px 0}
.logitem:last-child{border-bottom:none}
.logitem .lg-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.logitem .lg-who{font-weight:600}
.logitem .lg-when{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.logitem .lg-chg{font-family:var(--mono);font-size:12px;color:var(--text);white-space:pre-wrap;
  margin-top:5px;line-height:1.65}
.logitem .lg-why{font-size:12.5px;color:var(--muted);margin-top:4px}
.logitem .lg-why b{color:var(--text)}
.ptrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;background:var(--surface)}
.ptrow:hover{border-color:var(--accent)}
.ptrow .ab{font-family:var(--mono);font-weight:700;color:var(--accent)}
.ptrow .no-ab{font-size:12px;color:var(--crit);font-weight:600}
.field .hint-bad{color:var(--crit);font-weight:600}
/* วันที่ + เวลา อยู่คู่กัน — จอแคบวางซ้อนกันเพื่อให้ปุ่มยังกดง่าย */
.dtpair{display:flex;gap:8px}
.dtpair>input{flex:1 1 0;min-width:0}
.dtpair>input[type="date"]{flex:1.35 1 0}
@media(max-width:420px){.dtpair{flex-direction:column}}
.withadd{display:flex;gap:8px;align-items:stretch}
.withadd select{flex:1;min-width:0}
.withadd .icon-btn{width:var(--tap);height:auto;min-height:var(--tap);flex:0 0 auto;font-size:20px;font-weight:400;line-height:1}
@media(min-width:900px){.withadd .icon-btn{width:40px;min-height:40px}}
optgroup{font-family:var(--sans);font-size:12px;color:var(--muted)}
optgroup option{color:var(--ink);font-size:15px}
.jobtag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.jobtag.j-na{background:var(--warn-soft);color:var(--warn)}
.jobtag.j-lab{background:var(--ok-soft);color:var(--ok)}
.jobtag.j-other{background:var(--surface-2);color:var(--muted)}

.btn{border:1px solid transparent;border-radius:9px;padding:0 18px;min-height:var(--tap);
  font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  justify-content:center;background:var(--accent);color:#fff;transition:filter .15s;white-space:nowrap}
@media(min-width:900px){.btn{min-height:38px;font-size:14px;padding:0 15px}}
.btn:hover{filter:brightness(1.08)}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.quiet{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%}
.btn.crit{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--crit);font-size:13.5px;min-height:18px}
.acct{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;margin-bottom:7px;min-height:var(--tap)}
.acct:hover{background:var(--surface-2);border-color:var(--accent)}
.acct .u{font-family:var(--mono);font-size:13px;font-weight:600}
.acct .r{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.demo-accounts{border-top:1px dashed var(--line);padding-top:14px}
.demo-accounts h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}

/* ═══════════ shell ═══════════ */
.app{display:grid;grid-template-columns:1fr;min-height:100vh;min-height:100dvh}
@media(min-width:900px){.app{grid-template-columns:228px 1fr}}
.rail{display:none}
@media(min-width:900px){
  .rail{display:flex;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;
    flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
}
.rail-head{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.rail-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  padding:14px 10px 5px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--ink-2);font-size:14.5px;
  width:100%;text-align:left;min-height:42px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);
  border-color:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:600}
.nav svg{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;
  padding:1px 7px;font-family:var(--mono);font-weight:600}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
@media(min-width:900px){.topbar{padding:12px 22px;gap:14px}}
.topbar h1{font-family:var(--display);font-size:17px;margin:0;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:900px){.topbar h1{font-size:18px}}
.topbar .sub{font-size:12.5px;color:var(--muted);display:none}
@media(min-width:900px){.topbar .sub{display:block}}
.userchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:22px;
  padding:4px 6px 4px 11px;background:var(--surface-2);cursor:pointer}
.userchip .txt{display:none}
@media(min-width:900px){.userchip .txt{display:block}}
.userchip .nm{font-size:13px;font-weight:600;line-height:1.2}
.userchip .rl{font-size:11px;color:var(--muted);line-height:1.2}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;font-family:var(--display);flex:0 0 auto}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:9px;
  width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:0 0 auto}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px}

.content{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;width:100%;
  padding-bottom:calc(76px + var(--safe-b))}
@media(min-width:900px){.content{padding:22px;gap:18px;padding-bottom:22px}}

/* ═══════════ bottom nav (mobile/tablet) ═══════════ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);
  box-shadow:0 -2px 12px -6px rgba(15,27,42,.25)}
@media(min-width:900px){.tabbar{display:none}}
.tab{flex:1;background:transparent;border:0;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px 7px;font-size:10.5px;line-height:1.2;min-height:58px;position:relative;font-weight:500}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2.5px;
  background:var(--accent);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:6px;right:calc(50% - 21px);background:var(--crit);color:#fff;
  border-radius:20px;font-size:10px;font-family:var(--mono);font-weight:600;padding:0 5px;line-height:15px;min-width:16px}

/* ═══════════ cards / kpi ═══════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
@media(min-width:900px){.card-h{padding:14px 16px;gap:10px}}
.card-h h2{font-family:var(--display);font-size:15px;margin:0;font-weight:600}
.card-h .note{font-size:12.5px;color:var(--muted)}
.card-b{padding:14px}
@media(min-width:900px){.card-b{padding:16px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:639px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
@media(min-width:640px){.kpis{grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.k-ok::before{background:var(--ok)} .kpi.k-warn::before{background:var(--warn)} .kpi.k-crit::before{background:var(--crit)}
.kpi .lab{font-size:11.5px;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
@media(min-width:900px){.kpi .val{font-size:29px}}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:880px){.grid2{grid-template-columns:1fr 1fr}}
/* กัน grid/flex item ดันความกว้างจนหน้าเลื่อนแนวนอน */
.grid2>*,.card,.card-b,.kpis>*,.baglist>*,.rows>*{min-width:0}
.tablewrap{max-width:100%}

/* ═══════════ pills ═══════════ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.p-issued{background:var(--accent-soft);color:var(--accent-ink)}
.p-transfusing{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-returned{background:var(--surface-2);color:var(--muted)}
.p-void{background:var(--surface-2);color:var(--muted);border-color:var(--line);
  text-decoration:line-through;text-decoration-thickness:1px}
.p-react{background:var(--crit-soft);color:var(--crit)}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 7px;
  border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.abo{display:inline-grid;place-items:center;min-width:34px;height:24px;border-radius:6px;
  font-family:var(--display);font-weight:700;font-size:13px;background:var(--crit-soft);color:var(--crit);padding:0 7px;flex:0 0 auto}

/* ═══════════ table (wide only) ═══════════ */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
table.narrow{min-width:420px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
tbody td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
/* จอกว้างมากค่อยคลายให้หายใจ */
@media(min-width:1200px){thead th{padding:9px 12px} tbody td{padding:10px 12px}}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
.pt-name{font-weight:600;white-space:nowrap}
.pt-hn{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
/* วันที่+เวลาซ้อนกัน 2 บรรทัด ตารางจะได้ไม่กว้างจนต้องเลื่อน */
.dt-d{font-family:var(--mono);white-space:nowrap}
.dt-t{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.dt-next{color:var(--accent);font-weight:600}

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad2(x){ return ("0"+x).slice(-2); }
function nowLocal(){ var d=new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function fmtDate(iso){ if(!iso) return "—"; var d=String(iso).slice(0,10).split("-");
  return d.length<3 ? "—" : d[2]+"/"+d[1]+"/"+(Number(d[0])+543); }
function fmtDT(iso){ return iso ? fmtDate(iso)+" "+String(iso).slice(11,16) : "—"; }
function todayIso(){ var d=new Date();
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function p2(n){ return (n<10?"0":"")+n; }
function addDays(iso, n){
  var a=String(iso).split("-");
  var d=new Date(Number(a[0]), Number(a[1])-1, Number(a[2])+Number(n));
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
/** "22/08/2569 09:00 – 12:00" หรือ "…09:00 – 23/08/2569 02:00" เมื่อให้ข้ามคืน */
function fmtSpan(t){
  t = t || {};
  if (!t.start && !t.end) return "—";
  var a = (t.startD ? fmtDate(t.startD)+" " : "") + (t.start || "—");
  if (!t.end) return a + " – ยังไม่ปิดถุง";
  var crossed = t.endD && t.startD && t.endD !== t.startD;
  return a + " – " + (crossed ? fmtDate(t.endD)+" " : "") + t.end;
}
function initials(n){ return (String(n||"?").replace(/^(นาย|นาง|น\.ส\.|นางสาว|นพ\.|พญ\.)/,"").trim().charAt(0)) || "?"; }
function opt(list, sel){ return (list||[]).map(function(x){
  return '<option'+(String(x)===String(sel)?' selected':'')+'>'+esc(x)+'</option>'; }).join(""); }

/**
 * เหมือน opt() แต่ถ้าค่าที่บันทึกไว้ไม่มีในรายการ จะใส่ไว้เป็นตัวเลือกแรกให้ด้วย
 * สำคัญตอนแก้ข้อมูลเก่า — ไม่งั้นกดบันทึกแล้วค่าเดิมจะถูกเปลี่ยนโดยไม่ตั้งใจ
 */
function optKeep(list, sel){
  var a = (list||[]).slice();
  var v = String(sel==null?"":sel);
  if (v && a.map(String).indexOf(v) < 0) a.unshift(v);
  if (!v) a.unshift("");
  return a.map(function(x){
    return '<option value="'+esc(x)+'"'+(String(x)===v?' selected':'')+'>'+
           (String(x)===""?"— ไม่ระบุ —":esc(x))+'</option>'; }).join("");
}

/**
 * คลี่ถุงเลือดจากอาร์เรย์ตามตำแหน่งที่เซิร์ฟเวอร์ส่งมา
 * ลำดับต้องตรงกับ packBag_() ใน Code.gs
 */
function unpackBag(a){
  var b = {id:a[0], issuedAt:a[1], hn:a[2], donorNo:a[3], comp:a[4], donorAbo:a[5], tempOut:a[6],
           labIssuer:a[7], carrier:a[8], unit:a[9], status:a[10]};
  var t = a[11];
  if (t) b.tx = {v1:!!t[0], v2:!!t[1], v3:!!t[2], v4:!!t[3], tempIn:t[4], dx:t[5], volume:t[6],
                 checker:t[7], giver:t[8], start:t[9], end:t[10], reaction:!!t[11], reactAt:t[12],
                 symptoms:t[13]||[], actions:t[14]||[], setLeft:t[15], leak:t[16], rbc:t[17], note:t[18],
                 startD:t[19]||"", endD:t[20]||""};
  var q = a[12];
  if (q) b.ret = {at:q[0], reason:q[1], by:q[2], labReceiver:q[3], tempBack:q[4], cond:q[5], note:q[6]};
  return b;
}
function normBag(x){
  if (x instanceof Array) return unpackBag(x);
  if (looksLikeArray(x)) return unpackBag(fixArrays(x));
  return x;
}
function normBags(list){
  var arr = (list instanceof Array) ? list : (looksLikeArray(list) ? fixArrays(list) : []);
  return arr.map(normBag);
}

      var a = l.split("\t"); return {name:a[0], unit:a[1]||"", job:a[2]||"พยาบาล"}; }),
    config: m.config || {}
  };
}

/** อัปเดตถุงเลือดใบเดียวหลังบันทึก — แทนการโหลดข้อมูลใหม่ทั้งชุด */
function patchBag(raw){
  var bag = raw ? normBag(raw) : null;
  if (!bag || !S.D) return;
  if (S.D.units && S.D.units.indexOf(bag.unit) < 0) return;
  var list = S.D.bags, i;
  for (i = 0; i < list.length; i++) if (list[i].id === bag.id) { list[i] = bag; saveCache(); return; }
  list.push(bag);
  saveCache();
}
function patchMaster(kind, row, oldKey, mv){
  if (!row) return;
  var list = kind === "patient" ? S.D.patients : S.D.staff;
  var key  = kind === "patient" ? "hn" : "name";
  var hit = -1, i;
  for (i = 0; i < list.length; i++) if (String(list[i][key]) === String(oldKey || row[key])) { hit = i; break; }
  if (kind === "staff" && row.active === false) { if (hit >= 0) list.splice(hit,1); }
  else if (hit >= 0) list[hit] = row;
  else list.push(row);
  if (mv) S.mv = mv;
  // เก็บรูปแบบข้อความไว้ให้ตรงกัน เพื่อให้แคชในเครื่องยังใช้ได้
  S.rawMaster = S.rawMaster || {};
  S.rawMaster.patients = S.D.patients.map(function(x){ return [x.hn,x.name,x.abo||"",x.rh||""].join("\t"); }).join("\n");
  S.rawMaster.staff = S.D.staff.map(function(x){ return [x.name,x.unit||"",x.job||"พยาบาล"].join("\t"); }).join("\n");
  S.rawMaster.config = S.D.config;
  if (S.admin) S.admin = null;   // หน้าตั้งค่าระบบจะโหลดใหม่เมื่อเปิดครั้งหน้า
  saveCache();
}

/** ดึง HN จากข้อความที่พิมพ์ในช่องค้นหา — รับได้ทั้ง "900000001" และ "900000001 — นางสมใจ ใจดี" */
function hnOf(text){
  var v = String(text||"").trim();
  if (!v) return "";
  var head = v.split("—")[0].trim();
  if (P().some(function(x){ return String(x.hn)===head; })) return head;
  var byName = P().filter(function(x){ return x.name===v || (x.hn+" — "+x.name)===v; })[0];
  return byName ? String(byName.hn) : head;
}

/** เก็บ/คืนค่าที่กรอกไว้ในฟอร์ม เพื่อไม่ให้หายเวลาหน้าจอวาดใหม่ */
function snapForm(){
  var o = {v:{}, boxes:[]};
  [].slice.call(document.querySelectorAll(".content input[id], .content select[id], .content textarea[id]"))
    .forEach(function(el){ if (el.type!=="checkbox" && el.type!=="radio") o.v[el.id] = el.value; });
  [].slice.call(document.querySelectorAll('.content input[type="checkbox"], .content input[type="radio"]'))
    .forEach(function(el){ o.boxes.push(el.checked); });
  return o;
}
function restoreForm(o){
  if (!o) return;
  Object.keys(o.v).forEach(function(k){
    var el = document.getElementById(k); if (!el) return;
    if (el.tagName!=="SELECT" || [].some.call(el.options, function(x){ return x.value===o.v[k]; })) el.value = o.v[k];
  });
  var boxes = [].slice.call(document.querySelectorAll('.content input[type="checkbox"], .content input[type="radio"]'));
  if (boxes.length === o.boxes.length) boxes.forEach(function(el,i){ el.checked = o.boxes[i]; });
  syncFormUi();
}
/** ปรับสีช่องติ๊กและซ่อน/แสดงกล่องปฏิกิริยาให้ตรงกับค่าที่กรอกอยู่ */
function syncFormUi(){
  [].slice.call(document.querySelectorAll(".v-check")).forEach(function(c){
    var w = c.closest(".chk"); if (w) w.classList.toggle("done", c.checked);
  });
  syncTxDates();
  var r = document.querySelector('input[name="react"]:checked');
  if (r) {
    var box = document.getElementById("reactBox");
    if (box) box.classList.toggle("hide", r.value!=="1");
    [].slice.call(document.querySelectorAll('input[name="react"]')).forEach(function(x){
      var lab = x.closest(".radio"); if (!lab) return;
      lab.classList.remove("on","on-crit");
      if (x.checked) lab.classList.add(x.value==="1" ? "on-crit" : "on");
    });
  }
}
/**
 * เติมวันที่ให้อัตโนมัติ พยาบาลกรอกแค่เวลาก็พอในกรณีปกติ
 *  • พอกรอกเวลาเลือดหมด ระบบเติมวันที่หมดให้เป็นวันเดียวกับที่เริ่ม
 *  • ถ้าเวลาเลือดหมดน้อยกว่าเวลาเริ่ม แปลว่าให้ข้ามเที่ยงคืน จึงเลื่อนเป็นวันถัดไป
 * ทุกช่องยังแก้เองได้ ระบบไม่ทับค่าที่พยาบาลตั้งใจแก้
 */
function syncTxDates(){
  var sd = document.getElementById("t-startd"), st = document.getElementById("t-start");
  var ed = document.getElementById("t-endd"),   et = document.getElementById("t-end");
  if (!sd || !ed) return;
  if (st && st.value && !sd.value) sd.value = todayIso();
  if (et && et.value) {
    if (!ed.value) ed.value = (sd.value && st && st.value && et.value < st.value)
      ? addDays(sd.value, 1) : (sd.value || todayIso());
  } else if (!ed.dataset.touched) { ed.value = ""; }

  // ช่องวันที่ของเบราว์เซอร์แสดงเป็น ค.ศ. จึงทวนเป็น พ.ศ. ให้อ่านยืนยันอีกชั้น
  var sh = document.getElementById("t-starthint");
  if (sh) sh.textContent = sd.value ? "วันที่ " + fmtDate(sd.value) : "";

  var hint = document.getElementById("t-endhint");
  if (!hint) return;
  var crossed = sd.value && ed.value && ed.value !== sd.value;
  var bad = sd.value && ed.value && et && et.value && st && st.value &&
            (ed.value < sd.value || (ed.value === sd.value && et.value < st.value));
  hint.className = "hint" + (bad ? " hint-bad" : (crossed ? " hint-note" : ""));
  hint.textContent = bad ? "เวลาเลือดหมดอยู่ก่อนเวลาเริ่มให้ — ถ้าให้ข้ามคืน แก้วันที่เลือดหมดเป็นวันถัดไป"
    : crossed ? "ให้ข้ามคืน — เลือดหมดวันที่ " + fmtDate(ed.value)
    : ed.value ? "วันที่ " + fmtDate(ed.value)
    : "เว้นว่างไว้หากยังให้ไม่เสร็จ";
}

function pageDash(){
  // สถิติ = เฉพาะถุงในปีงบประมาณที่เลือก · งานค้าง = ทุกถุงที่ยังไม่ปิด ไม่ว่าปีไหน
  // ถุงที่ผู้ดูแลระบบยกเลิก (บันทึกผิด) ไม่ถูกนับทั้งสองทาง
  var b = liveScoped();
  var live = liveBags();
  var done = b.filter(function(x){ return x.status==="DONE"; });
  var react = done.filter(function(x){ return x.tx && x.tx.reaction; });
  var returned = b.filter(function(x){ return x.status==="RETURNED"; });
  var running = live.filter(function(x){ return x.status==="TRANSFUSING"; });
  var pending = live.filter(function(x){ return x.status==="ISSUED"; });
  var rate = done.length ? (react.length/done.length*100).toFixed(1) : "0.0";
  var retRate = b.length ? (returned.length/b.length*100).toFixed(1) : "0.0";
  var totalCc = done.reduce(function(s,x){ return s + (Number(x.tx && x.tx.volume)||0); }, 0);

  var byComp = {}, byUnit = {}, byDx = {};
  b.forEach(function(x){
    byComp[x.comp] = (byComp[x.comp]||0)+1;
    byUnit[x.unit] = (byUnit[x.unit]||0)+1;
    if (x.tx && x.tx.dx) byDx[x.tx.dx] = (byDx[x.tx.dx]||0)+1;
  });

  var alerts = [];
  running.forEach(function(x){ alerts.push({lvl:"warn",
    txt: pt(x.hn).name + " — กำลังให้เลือด " + x.comp + " ตั้งแต่ " +
         ((x.tx && x.tx.startD ? fmtDate(x.tx.startD)+" " : "") + ((x.tx&&x.tx.start)||"?")) +
         " น. ยังไม่ปิดถุง"}); });
  live.forEach(function(x){ var a = aboCheck(x); if (a) alerts.push({lvl:"crit", txt:"ถุง "+x.donorNo+" — "+a}); });
  live.forEach(function(x){ if (x.status==="ISSUED" || x.status==="TRANSFUSING") {
    var t = tempFlag(x.tempOut); if (t) alerts.push({lvl:"warn", txt:"ถุง "+x.donorNo+" — "+t+" ขณะจ่ายจาก Lab"}); } });

  return '' +
  '<div class="fybar">' +
    '<span class="lbl">ปีงบประมาณ</span>' +
    '<select id="fy-sel" aria-label="เลือกปีงบประมาณ">' +
      (S.fyList||[]).map(function(f){
        return '<option value="'+f+'"'+((!S.allFy && Number(S.fy)===Number(f))?" selected":"")+'>'+f+'</option>'; }).join("") +
      '<option value="all"'+(S.allFy?" selected":"")+'>ทุกปีงบประมาณ</option>' +
    '</select>' +
    '<span class="range">'+esc(fyRangeText())+'</span>' +
    ((!S.allFy && Number(S.fy)===Number(S.currentFy)) ? '<span class="now">ปีปัจจุบัน</span>' : '') +
  '</div>' +

  '<div class="kpis">' +
    kpi("", "ถุงเลือดทั้งหมด", b.length, "ถุง", S.allFy ? "ทุกปีงบประมาณ" : fyLabel(S.fy)) +
    kpi("k-ok", "ให้เลือดครบ", done.length, "ถุง", "รวม "+totalCc.toLocaleString()+" cc") +
    kpi("k-warn", "กำลังให้เลือด", running.length, "ราย", "รอปิดถุง") +
    kpi("k-crit", "อัตราการเกิดปฏิกิริยา", rate, "%", react.length+" จาก "+done.length+" ถุง") +
    kpi("", "อัตราการคืนถุงเลือด", retRate, "%", returned.length+" ถุงคืน Lab") +
  '</div>' +

  (alerts.length ?
    '<section class="card"><div class="card-h"><h2>ต้องติดตาม</h2><span class="note">'+alerts.length+' รายการ</span></div>' +
    '<div class="card-b" style="display:flex;flex-direction:column;gap:9px">' +
      alerts.map(function(a){ return '<div class="alert a-'+a.lvl+'">'+ICON.alert+'<div>'+esc(a.txt)+'</div></div>'; }).join("") +
    '</div></section>'
    : '<div class="alert a-ok">'+ICON.drop+'<div><b>ไม่มีรายการค้าง</b> — ถุงเลือดทุกถุงบันทึกครบและไม่พบข้อมูลผิดปกติ</div></div>') +

  '<div class="grid2">' +
    '<section class="card"><div class="card-h"><h2>แยกตามชนิดส่วนประกอบเลือด</h2></div>' +
      '<div class="card-b"><div class="bars">'+barsHtml(byComp)+'</div></div></section>' +
    '<section class="card"><div class="card-h"><h2>แยกตามหน่วยงานที่ให้เลือด</h2></div>' +
      '<div class="card-b"><div class="bars">'+barsHtml(byUnit)+'</div></div></section>' +
  '</div>' +

  '<div class="grid2">' +
    '<section class="card"><div class="card-h"><h2>ข้อบ่งชี้ในการให้เลือด</h2></div>' +
      '<div class="card-b"><div class="bars">'+barsHtml(byDx)+'</div></div></section>' +
    '<section class="card"><div class="card-h"><h2>ปริมาตรเลือดที่ให้รายเดือน</h2>' +
      '<span class="note">'+(S.allFy?"ทุกปีงบประมาณ":"ต.ค. – ก.ย.")+' · cc</span></div>' +
      '<div class="card-b">'+(S.allFy ? sparkVolume(done) : fyVolumeChart(done))+'</div></section>' +
  '</div>' +

  (pending.length ?
    '<section class="card"><div class="card-h"><h2>ถุงเลือดที่รอเริ่มให้</h2>' +
      '<span class="note">'+pending.length+' ถุง · ทุกปี</span><div class="spacer"></div>' +
      (hasPage("transfuse") ? '<button class="btn sm" data-act="go" data-p="transfuse">ไปบันทึก</button>' : '') +
    '</div><div class="card-b"><div class="baglist">' +
      pending.slice(0,6).map(function(x){ return bagCard(x, ""); }).join("") +
    '</div></div></section>' : "");
}

function kpi(cls, lab, val, unit, foot){
  return '<div class="kpi '+cls+'"><div class="lab">'+esc(lab)+'</div>' +
    '<div class="val">'+esc(val)+'<small>'+esc(unit)+'</small></div>' +
    '<div class="foot">'+esc(foot)+'</div></div>';

function barsHtml(obj, critFirst){
  var e = Object.keys(obj).map(function(k){ return [k, obj[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  if (!e.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  var max = Math.max.apply(null, e.map(function(x){ return x[1]; }).concat([1]));
  return e.map(function(x, i){
    var color = (critFirst && i<2) ? ';background:var(--crit)' : '';
    return '<div class="barrow"><span class="lb" title="'+esc(x[0])+'">'+esc(x[0])+'</span>' +
      '<span class="bartrack"><span class="barfill '+(i>2?"b3":i>0?"b2":"")+'" style="width:'+Math.round(x[1]/max*100)+'%'+color+'"></span></span>' +
      '<span class="vv">'+x[1]+'</span></div>';
  }).join("");
}

/** ปริมาตรเลือดรายเดือนตลอดปีงบประมาณ ต.ค. → ก.ย. */
function fyVolumeChart(done){
  var startY = Number(String(S.fyStart||"").slice(0,4));
  if (!startY) return sparkVolume(done);

  var buckets = FY_MONTHS.map(function(m){
    return {m:m, year: m >= 10 ? startY : startY + 1, cc:0, bags:0};
  });
  done.forEach(function(b){
    var d = String(b.issuedAt||"");
    var y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
    for (var i=0;i<buckets.length;i++){
      if (buckets[i].m===m && buckets[i].year===y){
        buckets[i].cc += Number(b.tx && b.tx.volume) || 0;
        buckets[i].bags += 1;
        break;
      }
    }
  });
  var max = Math.max.apply(null, buckets.map(function(x){ return x.cc; }));
  if (!(max > 0)) return '<div class="empty">ยังไม่มีข้อมูลปริมาตรที่ให้ในปีงบประมาณนี้</div>';

  var W = 360, H = 150, padB = 22, padT = 8;
  var bw = W / buckets.length;
  var bars = buckets.map(function(x,i){
    var h = Math.max(x.cc ? 2 : 0, (x.cc/max) * (H - padB - padT));
    var xx = i*bw + bw*0.18, w = bw*0.64, yy = H - padB - h;
    var thisMonth = (!S.allFy && x.year === new Date().getFullYear() && x.m === (new Date().getMonth()+1));
    return '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'"' +
      ' rx="2" fill="'+(thisMonth?"var(--accent)":"color-mix(in srgb,var(--accent) 55%,var(--surface))")+'">' +
      '<title>'+esc(THMON[x.m-1])+' '+(x.year+543)+' · '+x.cc.toLocaleString()+' cc · '+x.bags+' ถุง</title></rect>';
  }).join("");
  var labels = buckets.map(function(x,i){
    return '<text x="'+(i*bw + bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" ' +
      'font-size="9.5" fill="var(--muted)" font-family="var(--sans)">'+esc(THMON[x.m-1])+'</text>';
  }).join("");

  return '<svg class="mchart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" ' +
      'aria-label="ปริมาตรเลือดที่ให้รายเดือนตลอดปีงบประมาณ">' +
      '<line x1="0" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>' +
      bars + labels + '</svg>' +
    '<div class="mrow"><span>รวม '+buckets.reduce(function(s,x){return s+x.cc;},0).toLocaleString()+' cc</span>' +
    '<span>สูงสุด '+max.toLocaleString()+' cc/เดือน</span></div>';
}

function sparkVolume(done){
  var byDay = {};
  done.forEach(function(b){ var d = String(b.issuedAt).slice(0,10);
    byDay[d] = (byDay[d]||0) + (Number(b.tx && b.tx.volume)||0); });
  var e = Object.keys(byDay).sort().map(function(k){ return [k, byDay[k]]; })
    .filter(function(x){ return isFinite(x[1]); });
  if (!e.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  var max = Math.max.apply(null, e.map(function(x){ return x[1]; }));
  // ถุงที่ปิดแล้วแต่ยังไม่ได้กรอกปริมาตร จะทำให้ค่าสูงสุดเป็น 0 — ไม่ต้องวาดกราฟ
  if (!(max > 0)) return '<div class="empty">ยังไม่มีข้อมูลปริมาตรที่ให้</div>';
  var W = 520, H = 74, pad = 6;
  var step = e.length > 1 ? (W-pad*2)/(e.length-1) : 0;
  function px(i){ return pad + i*step; }
  function py(v){ return H-pad - (v/max)*(H-pad*2); }
  var line = e.map(function(x,i){ return px(i).toFixed(1)+","+py(x[1]).toFixed(1); }).join(" ");
  var area = pad+","+(H-pad)+" "+line+" "+px(e.length-1).toFixed(1)+","+(H-pad);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="ปริมาตรเลือดที่ให้รายวัน">' +
    '<polygon points="'+area+'" fill="var(--accent-soft)"></polygon>' +
    '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></polyline>' +

function bagCard(b, buttons){
  var p = pt(b.hn), st = STATUS[b.status] || STATUS.ISSUED;
  var warn = aboCheck(b) || ((b.status==="ISSUED"||b.status==="TRANSFUSING") ? tempFlag(b.tempOut) : null);
  return '<article class="bag s-'+String(b.status).toLowerCase()+'"><div class="stripe"></div><div class="bag-b">' +
    '<div class="bag-top"><div class="who"><div class="nm">'+esc(p.name)+'</div>' +
      '<div class="pt-hn">HN '+esc(p.hn)+' · '+esc(b.unit)+'</div></div>' +
      '<span class="abo">'+esc(p.abo)+'</span></div>' +
    '<dl class="bag-meta">' +
      '<dt>Donor No.</dt><dd>'+esc(b.donorNo)+'</dd>' +
      '<dt>ส่วนประกอบ</dt><dd>'+esc(b.comp)+' · หมู่ '+esc(b.donorAbo)+'</dd>' +
      '<dt>จ่ายเมื่อ</dt><dd>'+esc(fmtDT(b.issuedAt))+'</dd>' +
      '<dt>อุณหภูมิ</dt><dd>'+esc(b.tempOut)+'°C</dd></dl>' +
    (warn ? '<div class="alert a-crit" style="padding:8px 9px;font-size:12.5px">'+ICON.alert+'<div>'+esc(warn)+'</div></div>' : '') +
    '<div class="bag-foot"><span class="pill '+st.cls+'">'+st.label+'</span>' +
      '<div class="bag-sp"></div>'+(buttons||'')+'</div>' +
  '</div></article>';
}

/**
 * ช่องวันที่+เวลาในตาราง
 * วันที่ตรงกับวันอ้างอิง (วันจ่ายเลือด / วันเริ่มให้) ก็แสดงแค่เวลา ตารางจะได้ไม่กว้างเกินจอ

function dtCell(d, tm, sameAs){
  if (!tm && !d) return '<span class="dt-t">—</span>';
  var same = d && sameAs && d === sameAs;
  if (same || !d) return '<div class="dt-d">'+esc(tm||"—")+'</div>';
  return '<div class="dt-d dt-next" title="'+esc(fmtDate(d))+'">'+esc(fmtDate(d))+'</div>' +
         '<div class="dt-t">'+esc(tm||"—")+'</div>';
}

    var p = pt(b.hn), t = b.tx || {}, st = STATUS[b.status] || STATUS.ISSUED;

      '<div class="row-top"><div class="nm">'+esc(p.name)+'</div><span class="abo">'+esc(p.abo)+'</span></div>' +
      '<div class="row-sub"><span class="mono">'+esc(fmtDate(b.issuedAt))+'</span>' +
        '<span class="tag">'+esc(b.comp)+'</span><span>'+esc(b.unit)+'</span>' +
        (t.volume ? '<span class="mono">'+esc(t.volume)+' cc</span>' : '') + '</div>' +

  '<div class="tablewrap wide-only"><table><thead><tr>' +
    '<th>วันที่จ่าย</th><th>ผู้ป่วย</th><th>Donor No.</th><th>ชนิด</th><th>หมู่</th><th>หน่วยงาน</th>' +
    '<th>ข้อบ่งชี้</th><th class="num">cc</th><th>เริ่มให้</th><th>เลือดหมด</th>' +
    '<th>ปฏิกิริยา</th><th>สถานะ</th><th></th>' +
  '</tr></thead><tbody>' + list.map(function(b){
    var p = pt(b.hn), t = b.tx || {}, st = STATUS[b.status] || STATUS.ISSUED;
    return '<tr><td class="mono nw">'+esc(fmtDate(b.issuedAt))+'</td>' +
      '<td><div class="pt-name">'+esc(p.name)+'</div><div class="pt-hn">HN '+esc(p.hn)+'</div></td>' +
      '<td class="mono nw">'+esc(b.donorNo)+'</td><td><span class="tag">'+esc(b.comp)+'</span></td>' +

      '<td>'+(t.reaction?'<span class="pill p-react">มี</span>':(b.tx?'<span class="pill p-done">ไม่มี</span>':"—"))+'</td>' +

function pageRegistry(){
  var f = S.filter, list = bags().slice();
  if (f.q) { var q = f.q.toLowerCase();
    list = list.filter(function(b){ return (pt(b.hn).name+" "+b.hn+" "+b.donorNo).toLowerCase().indexOf(q) >= 0; }); }
  if (f.unit) list = list.filter(function(b){ return b.unit===f.unit; });
  if (f.comp) list = list.filter(function(b){ return b.comp===f.comp; });
  if (f.status) list = list.filter(function(b){ return b.status===f.status; });
  if (f.react==="1") list = list.filter(function(b){ return b.tx && b.tx.reaction; });
  list.sort(function(a,b){ return String(b.issuedAt).localeCompare(String(a.issuedAt)); });
  var shown = list.slice(0, S.limit);

  return '' +
  '<section class="card"><div class="card-h"><h2>ตัวกรอง</h2><div class="spacer"></div>' +

    '<div class="field"><label for="f-unit">หน่วยงาน</label><select id="f-unit"><option value="">ทั้งหมด</option>'+opt(cfg("units"), f.unit)+'</select></div>' +

    '<div class="field"><label for="f-status">สถานะ</label><select id="f-status"><option value="">ทั้งหมด</option>' +
      Object.keys(STATUS).map(function(k){ return '<option value="'+k+'"'+(f.status===k?" selected":"")+'>'+STATUS[k].label+'</option>'; }).join("") +
    '</select></div>' +
    '<div class="field"><label for="f-react">ปฏิกิริยา</label><select id="f-react"><option value="">ทั้งหมด</option>' +
      '<option value="1"'+(f.react==="1"?" selected":"")+'>เฉพาะที่มีปฏิกิริยา</option></select></div>' +
    '<div class="field"><label for="f-fy">ปีงบประมาณ</label><select id="f-fy">' +
      (S.fyList||[]).map(function(x){
        return '<option value="'+x+'"'+((!S.allFy && Number(S.fy)===Number(x))?" selected":"")+'>'+x+'</option>'; }).join("") +
      '<option value="all"'+(S.allFy?" selected":"")+'>ทุกปีงบประมาณ</option></select></div>' +
  '</div></div></section>' +

    '<span class="note">'+list.length+' รายการ</span></div>' +

      (list.length > shown.length ?
        '<div style="padding-top:12px"><button class="btn quiet block" data-act="more">' +
        'แสดงเพิ่มอีก '+Math.min(40, list.length-shown.length)+' รายการ</button></div>' : '') +
      '<div class="hint" style="text-align:center;padding-top:12px">' +
        (S.allFy ? 'แสดงข้อมูลทุกปีงบประมาณ'

function pageReact(){
  var scoped = liveScoped();   // ถุงที่ยกเลิกไปแล้วไม่นับเป็นปฏิกิริยา
  var list = scoped.filter(function(b){ return b.tx && b.tx.reaction; })
    .sort(function(a,b){ return String(b.issuedAt).localeCompare(String(a.issuedAt)); });
  var done = scoped.filter(function(b){ return b.status==="DONE"; }).length;
  var symCount = {};
  list.forEach(function(b){ (b.tx.symptoms||[]).forEach(function(s){ symCount[s]=(symCount[s]||0)+1; }); });
  var stopped = list.filter(function(b){ return (b.tx.actions||[]).indexOf("หยุดให้เลือดทันที")>=0; }).length;

  return '' +
  '<div class="kpis">' +
    kpi("k-crit", "เกิดปฏิกิริยา", list.length, "ราย", S.allFy ? "ทุกปีงบประมาณ" : fyLabel(S.fy)) +
    kpi("", "อัตราการเกิด", done ? (list.length/done*100).toFixed(1) : "0.0", "%", "จากที่ให้ครบ "+done+" ถุง") +
    kpi("k-warn", "ต้องหยุดให้เลือด", stopped, "ราย", "มีการ hold ถุงเลือด") +
  '</div>' +

  '<section class="card"><div class="card-h"><h2>อาการที่พบบ่อย</h2></div>' +
    '<div class="card-b"><div class="bars">'+barsHtml(symCount, true)+'</div></div></section>' +

  '<section class="card"><div class="card-h"><h2>รายละเอียดรายกรณี</h2>' +
    '<span class="note">'+list.length+' รายการ</span></div>' +
  '<div class="card-b" style="display:flex;flex-direction:column;gap:12px">' +
    (list.length ? list.map(function(b){ var p=pt(b.hn), t=b.tx;
      return '<div class="card" style="box-shadow:none"><div class="card-h">' +
        '<span class="pill p-react">ปฏิกิริยา</span><h2 style="font-size:14.5px">'+esc(p.name)+'</h2>' +
        '<span class="pt-hn mono">HN '+esc(p.hn)+'</span><span class="tag">'+esc(b.unit)+'</span>' +
        '<div class="spacer"></div><span class="note mono">'+esc(fmtDate(b.issuedAt))+' · '+esc(t.reactAt||"?")+' น.</span></div>' +
      '<div class="card-b" style="display:flex;flex-direction:column;gap:10px">' +

          ((t.symptoms||[]).map(function(s){ return '<span class="tag" style="margin:0 4px 4px 0">'+esc(s)+'</span>'; }).join("") || "—") + '</div>' +
        '<div><span style="font-size:12px;color:var(--muted)">การแก้ไข · </span>' +
          ((t.actions||[]).map(function(s){ return '<span class="tag" style="margin:0 4px 4px 0">'+esc(s)+'</span>'; }).join("") || "—") + '</div>' +
        (t.note ? '<div class="alert a-warn" style="font-size:13px">'+ICON.alert+'<div>'+esc(t.note)+'</div></div>' : '') +
        '<div><button class="btn sm quiet" data-act="detail" data-id="'+esc(b.id)+'">ดูรายละเอียดถุงเลือด</button></div>' +
      '</div></div>';
    }).join("") : '<div class="empty">ยังไม่มีรายงานปฏิกิริยา</div>') +

}

function patientResults(){
  var q = String(S.ptQuery||"").trim().toLowerCase();
  if (!q) return '<div class="hint" style="padding:4px 2px">พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อค้นหา</div>';
  if (q.length < 2) return '<div class="hint" style="padding:4px 2px">พิมพ์อีกเล็กน้อย…</div>';
  var hit = P().filter(function(x){
    return (String(x.hn)+" "+String(x.name)).toLowerCase().indexOf(q) >= 0; });
  if (!hit.length) return '<div class="empty">ไม่พบผู้ป่วยที่ตรงกับ "'+esc(S.ptQuery)+'"</div>';
  var show = hit.slice(0, 25);
  return '<div style="display:flex;flex-direction:column;gap:7px">' +
    show.map(function(x){
      return '<div class="ptrow" data-act="editPatient" data-hn="'+esc(x.hn)+'">' +
        '<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(x.name)+'</div>' +
        '<div class="mono" style="font-size:12px;color:var(--muted)">HN '+esc(x.hn)+'</div></div>' +
        (x.abo ? '<span class="ab">'+esc(x.abo)+' '+esc(x.rh||"")+'</span>'
               : '<span class="no-ab">ยังไม่ระบุหมู่เลือด</span>') + '</div>'; }).join("") +
    (hit.length > show.length
      ? '<div class="hint">พบ '+hit.length.toLocaleString()+' ราย แสดง '+show.length+' รายแรก — พิมพ์ให้เจาะจงขึ้น</div>'
      : '') + '</div>';
}

/* ═══════════════════════════════════════════════════════════
   15. การกระทำ
   ═══════════════════════════════════════════════════════════ */
function busy(on){
  S.busy = on;
  var el = document.getElementById("ovl");
  if (el) el.classList.toggle("hide", !on);
}

function doLogin(){
  var u = ($("#lu").value||"").trim().toLowerCase();
  var p = ($("#lp").value||"").trim();
  S.loginUser = u; S.loginErr = "";
  if (!u || !p) { S.loginErr = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน"; return paint(); }
  busy(true);
  rpc("login", {username:u, pin:p}).then(function(d){
    store("bs_token", d.token);
    clearCache(); S.mv = ""; S.D = null; S.admin = null; S.allLoaded = false; S.days = 120;
    return rpc("bootstrap", {mv:""}).then(function(D){
      applyBoot(D);
      S.page = (D.pages||["dash"])[0];
      busy(false); S.loginErr = ""; paint(); startAutoSync();
      if (d.mustChangePin) { S.modal = {type:"pin"}; paint();
        toast("กรุณาเปลี่ยนรหัสผ่านเริ่มต้นเพื่อความปลอดภัย", true); }
    });
  }).catch(function(e){ busy(false); S.loginErr = e.message; paint(); });
}

/**
 * ดึงข้อมูลล่าสุด
 *  opts.bg    = true  → ทำงานเบื้องหลัง ไม่บังหน้าจอ
 *  opts.days  = จำนวนวันย้อนหลังที่ต้องการ (ปกติ 120 วัน)
 *  opts.quiet = true  → ไม่ต้องขึ้นข้อความแจ้ง
 * ข้อมูลหลัก (ทะเบียนผู้ป่วย/เจ้าหน้าที่) จะถูกส่งมาเฉพาะตอนที่ฝั่งเซิร์ฟเวอร์เปลี่ยนเท่านั้น
 */
function refresh(opts){
  opts = opts || {};
  var req = {mv:S.mv};
  if (opts.allFy) req.allFy = true;
  else req.fy = opts.fy || S.fy || 0;
  if (opts.bg) { S.syncing = true; syncPill(); } else busy(true);
  return rpc("bootstrap", req).then(function(D){
    applyBoot(D);
    S.syncing = false; S.syncErr = false;
    if (opts.bg) { syncPill(); repaint(); }
    else { busy(false); repaint(); }
    if (!opts.quiet) toast("โหลดข้อมูลล่าสุดแล้ว");
  }).catch(function(e){
    S.syncing = false;
    if (/เซสชัน/.test(e.message)) { logout(); toast(e.message, true); return; }
    S.syncErr = true;
    if (opts.bg) { syncPill(); } else { busy(false); toast(e.message, true); }
  });
}
function reload(quiet){ return refresh({quiet:quiet}); }
/** เปลี่ยนปีงบประมาณที่กำลังดู */
function switchFy(v){
  if (v === "all") refresh({allFy:true, quiet:true}).then(function(){ toast("แสดงข้อมูลทุกปีงบประมาณ"); });
  else refresh({fy:Number(v), quiet:true}).then(function(){ toast("แสดง" + fyLabel(Number(v))); });
}

/**
 * แถบบอกความสดของข้อมูล — สำคัญเพราะหน้าจอเปิดจากแคชได้ทันที
 * ถ้าดึงข้อมูลใหม่ไม่สำเร็จ ต้องบอกให้ชัดว่าที่เห็นอยู่อาจไม่ใช่ข้อมูลล่าสุด
 */
function syncState(){
  if (S.syncing) return {cls:"", html:'<span class="spin"></span>กำลังอัปเดต'};
  if (S.syncErr)  return {cls:" bad",
    html:ICON.alert + 'อัปเดตไม่สำเร็จ<span class="wide-only"> — แตะเพื่อลองใหม่</span>'};
  var mins = S.lastSync ? Math.round((Date.now() - S.lastSync)/60000) : 9999;
  if (mins >= 10) return {cls:" old",
    html:ICON.alert + esc(agoText()) + '<span class="wide-only"> — แตะเพื่ออัปเดต</span>'};
  return {cls:" hide", html:""};
}
function syncPill(){
  var el = document.getElementById("sync");
  if (!el) return;
  var st = syncState();
  el.className = "syncpill" + st.cls;
  el.innerHTML = st.html;
}
function agoText(){
  if (!S.lastSync) return "";
  var m = Math.round((Date.now() - S.lastSync)/60000);
  if (m < 1) return "อัปเดตเมื่อสักครู่";
  if (m < 60) return "อัปเดต " + m + " นาทีที่แล้ว";
  return "อัปเดต " + Math.round(m/60) + " ชม.ที่แล้ว";
}

/** แสดงผลการค้นหา HN ใต้ช่องกรอกแบบทันที */
function hnInfo(){
  var box = document.getElementById("i-hninfo"), inp = document.getElementById("i-hn");
  if (!box || !inp) return;
  var v = inp.value.trim();
  if (!v) {
    box.style.color = ""; 
    box.innerHTML = "ทะเบียนผู้ป่วย " + P().length.toLocaleString() + " ราย · ถ้าเป็นผู้ป่วยใหม่ กดปุ่ม + เพื่อเพิ่ม";
    return;
  }
  var hn = hnOf(v);
  var f = P().filter(function(x){ return String(x.hn)===hn; })[0];
  if (f) {
    box.style.color = "var(--ok)";
    box.innerHTML = "✓ " + esc(f.name) + (f.abo ? " · หมู่ " + esc(f.abo) + " " + esc(f.rh||"")
      : ' · <b>ยังไม่ระบุหมู่เลือด — ระบบจะไม่เตือนหมู่เลือดไม่เข้ากัน</b>');
  } else {
    box.style.color = "var(--crit)";
    box.innerHTML = "ไม่พบผู้ป่วยรายนี้" + (can("addPatient") ? " — กดปุ่ม + เพื่อเพิ่มผู้ป่วยใหม่" : "");
  }
}

      t.startD||"",t.start||"",t.endD||"",t.end||"",t.checker||"",t.giver||"",t.reaction?"มี":(b.tx?"ไม่มี":""),
      (t.symptoms||[]).join(" / "),(t.actions||[]).join(" / "),(STATUS[b.status]||{}).label||b.status]);
  });
  return "﻿" + rows.map(function(r){ return r.map(function(c){
    return '"' + String(c==null?"":c).replace(/"/g,'""') + '"'; }).join(","); }).join("\r\n");
}

function exportCsv(){
  if (!LIVE) {
    // หน้าตัวอย่างที่ฝังใน claude.ai ดาวน์โหลดไฟล์ไม่ได้ — ในระบบจริงบน Apps Script ดาวน์โหลดได้ทันที
    return toast("โหมดตัวอย่างดาวน์โหลดไฟล์ไม่ได้ — เมื่อติดตั้งบน Apps Script แล้วปุ่มนี้จะบันทึกไฟล์ CSV ทันที");
  }
  busy(true);
  rpc("exportCsv", S.allFy ? {allFy:true} : {fy:S.fy}).then(function(d){
    busy(false);
    var blob = new Blob([d.csv], {type:"text/csv;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "bloodsafe-" + (S.allFy ? "ทุกปี" : "ปีงบ" + S.fy) + "-" + nowLocal().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast("ดาวน์โหลดไฟล์ CSV แล้ว");
  }).catch(function(e){ busy(false); toast(e.message, true); });
}

/* ═══════════════════════════════════════════════════════════
   16. เหตุการณ์
   ═══════════════════════════════════════════════════════════ */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act;

  // ปิด overlay เฉพาะเมื่อแตะพื้นหลัง
  if (a === "closeModal" && el.classList.contains("overlay") && e.target.closest("[data-stop]")) return;

  switch (a) {
    case "fill":
      S.loginUser = el.dataset.u; S.loginErr = ""; paint();
      var pw = $("#lp"); if (pw) { pw.value = "1234"; pw.focus(); }
      return;
    case "login": doLogin(); return;
    case "logout": logout(); return;
    case "reload": S.modal = null; S.admin = null; reload(); return;
    case "go":
      S.page = el.dataset.p; S.editBag = null; S.modal = null; S.limit = 40;
      if (el.dataset.p !== "issue") S.issueUnit = "";
      paint(); window.scrollTo(0,0); return;
    case "menu": openModal({type:"menu"}); return;
    case "pin": openModal({type:"pin"}); return;
    case "savePin": savePin(); return;
    case "newUser": openModal({type:"user", username:""}); return;
    case "editUser": openModal({type:"user", username:el.dataset.u}); return;
    case "saveUser": saveUserForm(el.dataset.new === "1"); return;
    case "addStaff":
      openModal({type:"staff", name:"", unit:el.dataset.unit || (S.D.units ? S.D.units[0] : ""),
                 job:el.dataset.job, target:el.dataset.target});
      return;
    case "newStaff": openModal({type:"staff", name:"", unit:"", job:"พยาบาล"}); return;
    case "editStaff": openModal({type:"staff", name:el.dataset.n}); return;
    case "saveStaff": saveStaffForm(); return;
    case "addPatient": openModal({type:"patient", hn:""}); return;
    case "editPatient": openModal({type:"patient", hn:el.dataset.hn}); return;
    case "savePatient": savePatientForm(); return;
    case "editBag": openModal({type:"editbag", id:el.dataset.id}); return;
    case "saveEditBag": saveEditBag(el.dataset.id); return;
    case "askVoid": openModal({type:"void", id:el.dataset.id}); return;
    case "doVoid": doVoidBag(el.dataset.id, el.dataset.undo === "1"); return;
    case "editCfg": openModal({type:"cfg", key:el.dataset.k}); return;
    case "saveCfg": saveCfg(el.dataset.k); return;
    case "moreLog": moreLog(); return;
    case "theme": {
      var cur = document.documentElement.getAttribute("data-theme");
      var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      store("bs_theme", next);
      return;
    }
    case "startTx":
      S.page = "transfuse"; S.editBag = el.dataset.id; S.modal = null;
      paint(); window.scrollTo(0,0); return;
    case "reloadStaff": return;
    case "cancelTx": S.editBag = null; paint(); window.scrollTo(0,0); return;
    case "saveIssue": saveIssue(); return;
    case "saveTx": saveTx(el.dataset.id, el.dataset.close === "1"); return;
    case "openReturn": openModal({type:"return", id:el.dataset.id}); return;
    case "saveReturn": saveReturn(el.dataset.id); return;
    case "detail": openModal({type:"detail", id:el.dataset.id}); return;
    case "closeModal": closeModal(); return;
    case "clearFilter": S.filter = {}; S.limit = 40; paint(); return;
    case "more": S.limit += 40; paint(); return;
    case "loadAll": switchFy("all"); return;
    case "resync": if (!S.syncing) refresh({bg:true, quiet:true}); return;
    case "hardReload":
      clearCache(); S.mv = ""; S.admin = null; S.allLoaded = false;
      S.modal = null; paint();
      refresh({quiet:true}).then(function(){ toast("ล้างข้อมูลในเครื่องและโหลดใหม่เรียบร้อย"); });
      return;
    case "exportCsv": exportCsv(); return;
    case "toggleReact": {
      var on = el.value === "1";
      document.getElementById("reactBox").classList.toggle("hide", !on);
      [].slice.call(document.querySelectorAll('input[name="react"]')).forEach(function(r){
        var lab = r.closest(".radio");
        lab.classList.remove("on","on-crit");
        if (r.checked) lab.classList.add(r.value==="1" ? "on-crit" : "on");
      });
      return;
    }
  }
});

// ติ๊ก double-check แล้วเปลี่ยนสีทันที
document.addEventListener("change", function(e){
  if (e.target.classList && e.target.classList.contains("v-check")) {
    e.target.closest(".chk").classList.toggle("done", e.target.checked);
  }
  if (e.target.id === "i-unit") {
    S.issueUnit = e.target.value;
    var sel = document.getElementById("i-carrier");
    if (sel) {
      sel.innerHTML = staffOptions(S.issueUnit, ["ผู้ช่วยพยาบาล","พยาบาล"], "");
      var plus = sel.parentNode.querySelector('[data-act="addStaff"]');
      if (plus) plus.dataset.unit = S.issueUnit;
    }
  }
  if (e.target.id === "fy-sel" || e.target.id === "f-fy") { switchFy(e.target.value); return; }
  if (e.target.id === "t-endd") e.target.dataset.touched = "1";   // พยาบาลตั้งใจแก้เอง อย่าทับ
  if (["t-startd","t-start","t-endd","t-end"].indexOf(e.target.id) >= 0) { syncTxDates(); return; }
  var map = {"f-unit":"unit","f-comp":"comp","f-status":"status","f-react":"react"};
  if (map[e.target.id]) { S.filter[map[e.target.id]] = e.target.value; S.limit = 40; paint(); }
});

var qTimer = null, ptTimer = null;
document.addEventListener("input", function(e){
  if (e.target.id === "i-hn") { hnInfo(); return; }
  if (e.target.id === "e-hn") {   // แก้ถุงเลือด: บอกชื่อผู้ป่วยของ HN ที่พิมพ์ทันที
    var box = document.getElementById("e-hninfo");
    if (box) {
      var who = pt(e.target.value.trim());
      var found = !who.missing;
      box.textContent = found ? who.name + (who.abo ? " · หมู่ " + who.abo + " " + (who.rh||"") : "")
                              : "ไม่พบ HN นี้ในทะเบียนผู้ป่วย";
      box.className = "hint" + (found ? "" : " hint-bad");
    }
    return;
  }
  if (e.target.id === "a-pq") {   // ค้นหาผู้ป่วยในหน้าตั้งค่าระบบ
    var val = e.target.value, pos2 = e.target.selectionStart;
    clearTimeout(ptTimer);
    ptTimer = setTimeout(function(){
      S.ptQuery = val; paint();
      var n2 = $("#a-pq");
      if (n2) { n2.focus(); try { n2.setSelectionRange(pos2,pos2); } catch(err){} }
    }, 220);
    return;
  }
  if (e.target.id === "t-endd") e.target.dataset.touched = "1";
  if (["t-startd","t-start","t-endd","t-end"].indexOf(e.target.id) >= 0) { syncTxDates(); return; }
  if (e.target.id !== "f-q") return;
  var v = e.target.value, pos = e.target.selectionStart;
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    S.filter.q = v; S.limit = 40; paint();
    var n = $("#f-q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(err){} }
  }, 220);
});

document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !S.D && (e.target.id==="lu" || e.target.id==="lp")) doLogin();
  if (e.key === "Escape" && S.modal) closeModal();
});

/* ═══════════════════════════════════════════════════════════
   17. เริ่มทำงาน
   ═══════════════════════════════════════════════════════════ */
function paint(){
  $("#root").innerHTML = S.booting ? '<div class="loader"><div class="spin"></div></div>'
                       : (S.D ? viewApp() : viewLogin());
  document.body.style.overflow = S.modal ? "hidden" : "";
}
/** วาดใหม่แบบรักษาสิ่งที่ผู้ใช้กรอกค้างไว้ — ใช้เวลาข้อมูลอัปเดตเบื้องหลัง */
function repaint(){
  var snap = snapForm();
  paint();
  restoreForm(snap);
}

/** ดึงข้อมูลใหม่เป็นระยะ และทุกครั้งที่ผู้ใช้กลับมาที่หน้าจอ */
function startAutoSync(){
  if (startAutoSync._on) return;
  startAutoSync._on = true;
  setInterval(function(){
    if (S.D && !S.syncing && !S.busy && !document.hidden) refresh({bg:true, quiet:true});
  }, 300000);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden || !S.D || S.syncing || S.busy) return;
    if (Date.now() - S.lastSync > 120000) refresh({bg:true, quiet:true});
    else syncPill();
  });
  setInterval(syncPill, 60000);   // ให้ข้อความ "อัปเดตเมื่อ…" เดินตามเวลาจริง
}

(function boot(){
  // ล้าง token/แคชที่รุ่นก่อน 2.5 เคยเก็บไว้ถาวรใน localStorage
  try { Object.keys(localStorage).forEach(function(k){ if (isPrivateKey(k)) localStorage.removeItem(k); }); } catch(e){}
  var th = store("bs_theme");
  if (th) document.documentElement.setAttribute("data-theme", th);

  var tk = store("bs_token");
  if (!tk) { S.booting = false; return paint(); }

  var c = loadCache();
  if (c && c.user && c.mv) {
    // มีข้อมูลเดิมอยู่ในเครื่อง — แสดงทันที แล้วค่อยดึงของใหม่เบื้องหลัง
    applyCache(c);
    S.page = (c.pages || ["dash"])[0];
    S.booting = false; paint();
    startAutoSync();
    refresh({bg:true, quiet:true});
    return;
  }
  rpc("bootstrap", {mv:""}).then(function(D){
    applyBoot(D); S.page = (D.pages||["dash"])[0];
    S.booting = false; paint(); startAutoSync();
  }).catch(function(){
    store("bs_token", null); clearCache(); S.booting = false; paint();
  });
})();
</script>
